name: PhotoX

options:
  bundleIdPrefix: dev.frostman
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  PhotoX:
    type: application
    platform: macOS
    sources:
      - path: PhotoX
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX
        PRODUCT_NAME: PhotoX
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: PhotoX/PhotoX.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  PhotoXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoXTests
    dependencies:
      - target: PhotoX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoXTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhotoX:
    build:
      targets:
        PhotoX: all
        PhotoXTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoXTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
