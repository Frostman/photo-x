name: PhotoX

options:
  bundleIdPrefix: dev.frostman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Apple-Silicon only: ARCHS=arm64 below pins this regardless of the
    # macOS floor — the vendored LibRaw .a is built arm64 by
    # scripts/bootstrap.sh.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  PhotoX:
    type: application
    platform: macOS
    postCompileScripts:
      # Stage the card-watcher LaunchAgent plist inside the
      # built .app bundle at Contents/Library/LaunchAgents/
      # so SMAppService.register() can find it. Substitutes
      # the per-config vars ($(PHOTOX_HELPER_LABEL),
      # $(PHOTOX_PARENT_BUNDLE_ID)) so debug and release each
      # register a distinct launchd job that can coexist on
      # the same machine.
      - name: Stage CardWatcher LaunchAgent plist
        script: |
          set -e
          DEST_DIR="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LaunchAgents"
          mkdir -p "$DEST_DIR"
          PARENT_ID="$PRODUCT_BUNDLE_IDENTIFIER"
          HELPER_LABEL="$PARENT_ID.CardWatcher"
          sed \
            -e "s|\$(PHOTOX_HELPER_LABEL)|$HELPER_LABEL|g" \
            -e "s|\$(PHOTOX_PARENT_BUNDLE_ID)|$PARENT_ID|g" \
            "$PROJECT_DIR/PhotoXCardWatcher/CardWatcher.plist" \
            > "$DEST_DIR/CardWatcher.plist"
        inputFiles:
          - $(PROJECT_DIR)/PhotoXCardWatcher/CardWatcher.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/CardWatcher.plist
    sources:
      - path: PhotoX
        excludes:
          - "**/.DS_Store"
      - path: Resources/exiftool
        type: folder
        buildPhase: resources
        optional: true
      # Bundled third-party license texts. Apache 2.0 + MIT + LGPL all
      # require the license text to ship with binary distributions.
      # End users can read these at PhotoX.app/Contents/Resources/Licenses/.
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      # macOS's standard About panel renders this inline if present.
      - path: Resources/Credits.html
        buildPhase: resources
    dependencies:
      - package: Sparkle
      # Embed the background card-watcher helper inside the
      # parent app bundle at
      #   PhotoX.app/Contents/Library/LoginItems/PhotoXCardWatcher.app
      # — the canonical location SMAppService.agent /
      # SMAppService.loginItem expect to find nested
      # helper bundles. The LaunchAgent plist's
      # BundleProgram below points at the helper's
      # executable inside this nested .app.
      - target: PhotoXCardWatcher
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    info:
      # xcodegen generates Info.plist from this. Necessary because Xcode's
      # GENERATE_INFOPLIST_FILE only honors an allowlist of Apple-known keys
      # and silently drops custom ones (SUFeedURL, SUPublicEDKey, GitDescribe).
      # MARKETING_VERSION + CURRENT_PROJECT_VERSION become CFBundleShortVersionString
      # / CFBundleVersion via xcodebuild overrides at archive time.
      path: PhotoX/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        # Per-config so dev notifications, Dock label, About panel,
        # and window titles read "PhotoXDev" — quickly tells you the
        # build a banner came from when both dev and release are
        # registered on the same machine. See PHOTOX_DISPLAY_NAME
        # below.
        CFBundleDisplayName: $(PHOTOX_DISPLAY_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        # Sparkle update channel
        SUFeedURL: https://raw.githubusercontent.com/Frostman/photo-x/master/docs/appcast.xml
        SUPublicEDKey: "MWNF/JmW7AQ0wjmzYowNL1NNcybTAAfRnTQO3nsjbHs="
        # Background appcast poll every 5 minutes. Auto-DOWNLOAD stays
        # off (UpdaterController forces it at runtime). The standard
        # "Update Available" panel always asks the user; if the user
        # dismisses, UpdaterDelegate's shouldProceedWithUpdate suppresses
        # the same version on subsequent background checks until the
        # app restarts or the user hits Check for Updates explicitly.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 300   # 5 minutes
        # Human-readable git-derived version. Default value used for ad-hoc
        # dev builds; scripts/release.sh overrides via xcodebuild GIT_DESCRIBE=…
        GitDescribe: $(GIT_DESCRIBE)
        # PostHog ingest-only key (TelemetryUploader). Empty by default
        # → uploader short-circuits as a no-op (safe for dev / CI / forks).
        # Release builds can inject a real key via xcodebuild
        # POSTHOG_API_KEY=phc_… (wired in scripts/release.sh).
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        # URL scheme registered for the background card watcher's
        # "Open in PhotoX" notification action. Per-config so the
        # debug app handles `photox-dev://` and the release app
        # handles `photox://`, keeping the two installations'
        # routing isolated when both are present.
        CFBundleURLTypes:
          - CFBundleURLName: dev.frostman.PhotoX.URLScheme
            CFBundleURLSchemes:
              - $(PHOTOX_URL_SCHEME)
    settings:
      base:
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION are PLACEHOLDERS.
        # Real values come from scripts/release.sh which derives them from git
        # (commit count + short sha) and passes them as xcodebuild overrides.
        # Do not edit these by hand.
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX
        PRODUCT_NAME: PhotoX
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: PhotoX/PhotoX.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        # Default GitDescribe for ad-hoc dev builds; release.sh overrides.
        GIT_DESCRIBE: "0.0.0-uninitialized"
        # PostHog ingest key default. Empty → TelemetryUploader is a
        # no-op. Real release builds inject via xcodebuild
        # POSTHOG_API_KEY=phc_… (see scripts/release.sh).
        POSTHOG_API_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Obj-C++ bridge for LibRaw
        SWIFT_OBJC_BRIDGING_HEADER: PhotoX/PhotoX-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        # Static LibRaw (built into ThirdParty/libraw by scripts/bootstrap.sh)
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/ThirdParty/libraw/include
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/ThirdParty/libraw/lib/libraw_r.a
          - -lz
      configs:
        # Debug builds get a distinct bundle ID so macOS Launch Services
        # treats the dev build as a separate app from the installed
        # /Applications/PhotoX.app. Without this, clicking a notification
        # posted by the dev build routes to the installed Release copy
        # (same bundle ID → Launch Services picks the registered one).
        # Side effect: UserDefaults / Recents / Favorites / Export
        # Settings are also separate between Debug and Release — cleaner
        # for development, and you don't accidentally pollute your real
        # data while testing.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX.debug
          # Distinct iconset with an amber "DEV" pill so the debug build
          # is visually obvious in Finder, Dock, and Cmd-Tab. Generated
          # by scripts/generate_icon.swift (or `just icon`).
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
          # Debug builds are ad-hoc and need the library-validation
          # exception so the hardened runtime loads ad-hoc Sparkle.
          # Release uses PhotoX.entitlements (no exception) since we
          # Developer-ID re-sign Sparkle in scripts/release.sh.
          CODE_SIGN_ENTITLEMENTS: PhotoX/PhotoX-Debug.entitlements
          # Card-watcher LaunchAgent identity (per-config so debug and
          # release helpers register as separate launchd jobs).
          PHOTOX_URL_SCHEME: photox-dev
          # Dev builds advertise as "PhotoXDev" so notifications,
          # Dock label, Cmd-Tab, and the window title are
          # unambiguously the dev copy even when /Applications/PhotoX
          # is also installed.
          PHOTOX_DISPLAY_NAME: PhotoXDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX
          PHOTOX_DISPLAY_NAME: PhotoX
          PHOTOX_URL_SCHEME: photox

  PhotoXCardWatcher:
    # Must be `application`, not `tool` — `UNUserNotificationCenter`
    # rejects auth requests from a bare CLI binary with
    # "Notifications are not allowed for this application".
    # macOS tracks notification permission per `.app` bundle
    # registered with LaunchServices; a tool target produces
    # a Mach-O at `Contents/MacOS/...` that LaunchServices
    # never indexes, so the helper has no slot in the
    # notifications database and authorization fails.
    # `LSUIElement: true` (in the Info.plist below) keeps
    # the helper out of the Dock + Cmd-Tab list while still
    # allowing notifications, NSWorkspace observers, etc.
    type: application
    platform: macOS
    sources:
      - path: PhotoXCardWatcher
        excludes:
          - "**/.DS_Store"
          - "*.plist"
          - "*.entitlements"
      # Share the parent app's asset catalog so notifications
      # posted by the helper get the PhotoX icon (the amber
      # "DEV" pill variant for Debug). Without this the
      # banner falls back to the system's generic blank icon.
      # Xcode is happy to compile the same catalog into both
      # target wrappers — single source of truth, no
      # duplication needed.
      - path: PhotoX/Assets.xcassets
    info:
      path: PhotoXCardWatcher/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        # Display name aligned with the parent app — when the
        # helper posts a card-mount notification, the banner reads
        # "PhotoXDev" for dev / "PhotoX" for release. Without this,
        # macOS falls back to CFBundleName ("PhotoXCardWatcher")
        # which leaks the helper-implementation detail and doesn't
        # distinguish dev vs release at a glance.
        CFBundleDisplayName: $(PHOTOX_DISPLAY_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # LSUIElement replaces LSBackgroundOnly so the helper
        # can post notifications. LSBackgroundOnly bars apps
        # from any user-facing UI — including the
        # notification system — whereas LSUIElement just
        # hides the Dock icon and Cmd-Tab entry while
        # preserving every UI capability the helper needs.
        LSUIElement: true
        # Read at runtime by the helper to (a) check
        # frontmostApplication?.bundleIdentifier against this
        # build's parent app, and (b) build the URL it opens
        # in response to the notification action.
        PhotoXParentBundleID: $(PHOTOX_PARENT_BUNDLE_ID)
        PhotoXURLScheme: $(PHOTOX_URL_SCHEME)
        # Git-derived version string identical to the parent
        # app's About panel — `v<marketing>-<sha9>[-dirty]`
        # for release builds, `v0.0.0-dev-<sha9>[-dirty]`
        # for dev. Logged on helper startup so it's
        # immediately obvious in Console which build of the
        # helper is actually running, which matters whenever
        # the supervisor reports "running" but you suspect
        # an orphan from a previous rebuild is the live one.
        GitDescribe: $(GIT_DESCRIBE)
    settings:
      base:
        PRODUCT_NAME: PhotoXCardWatcher
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        # Mirror the parent app's icon selection — Release
        # uses the regular PhotoX icon, Debug overrides
        # below with the amber "DEV" pill variant. Reads
        # from the shared `PhotoX/Assets.xcassets` added in
        # `sources` above.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # `.app` bundles already get their Info.plist
        # written into `Contents/Info.plist` and bound to
        # the code signature by Xcode automatically — no
        # need for CREATE_INFOPLIST_SECTION_IN_BINARY (which
        # is the workaround only when shipping a bare
        # CLI/`tool` target).
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX.debug.CardWatcher
          PHOTOX_PARENT_BUNDLE_ID: dev.frostman.PhotoX.debug
          PHOTOX_HELPER_LABEL: dev.frostman.PhotoX.debug.CardWatcher
          PHOTOX_URL_SCHEME: photox-dev
          # Notifications posted by the helper read "PhotoXDev" so
          # they're clearly the dev build's banners.
          PHOTOX_DISPLAY_NAME: PhotoXDev
          CODE_SIGN_ENTITLEMENTS: PhotoXCardWatcher/PhotoXCardWatcher-Debug.entitlements
          # Helper's notification icon matches the dev app's
          # amber "DEV" pill variant.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX.CardWatcher
          PHOTOX_PARENT_BUNDLE_ID: dev.frostman.PhotoX
          PHOTOX_HELPER_LABEL: dev.frostman.PhotoX.CardWatcher
          PHOTOX_URL_SCHEME: photox
          PHOTOX_DISPLAY_NAME: PhotoX
          CODE_SIGN_ENTITLEMENTS: PhotoXCardWatcher/PhotoXCardWatcher.entitlements

  PhotoXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoXTests
    dependencies:
      - target: PhotoX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoXTests
        GENERATE_INFOPLIST_FILE: YES

  PhotoXUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PhotoXUITests
    dependencies:
      - target: PhotoX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoXUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoX

schemes:
  PhotoX:
    build:
      targets:
        PhotoX: all
        PhotoXTests: [test]
        PhotoXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoXTests
        - PhotoXUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
