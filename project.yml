name: PhotoX

options:
  bundleIdPrefix: dev.frostman
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple-Silicon only: macOS 26 won't run on Intel anyway, and the vendored
    # LibRaw .a is built arm64 by scripts/bootstrap.sh.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  PhotoX:
    type: application
    platform: macOS
    sources:
      - path: PhotoX
        excludes:
          - "**/.DS_Store"
      - path: Resources/exiftool
        type: folder
        buildPhase: resources
        optional: true
      # Bundled third-party license texts. Apache 2.0 + MIT + LGPL all
      # require the license text to ship with binary distributions.
      # End users can read these at PhotoX.app/Contents/Resources/Licenses/.
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      # macOS's standard About panel renders this inline if present.
      - path: Resources/Credits.html
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      # xcodegen generates Info.plist from this. Necessary because Xcode's
      # GENERATE_INFOPLIST_FILE only honors an allowlist of Apple-known keys
      # and silently drops custom ones (SUFeedURL, SUPublicEDKey, GitDescribe).
      # MARKETING_VERSION + CURRENT_PROJECT_VERSION become CFBundleShortVersionString
      # / CFBundleVersion via xcodebuild overrides at archive time.
      path: PhotoX/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: PhotoX
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        # Sparkle update channel
        SUFeedURL: https://raw.githubusercontent.com/Frostman/photo-x/master/docs/appcast.xml
        SUPublicEDKey: "MWNF/JmW7AQ0wjmzYowNL1NNcybTAAfRnTQO3nsjbHs="
        # Background appcast poll every 5 minutes. Auto-DOWNLOAD stays
        # off (UpdaterController forces it at runtime). The standard
        # "Update Available" panel always asks the user; if the user
        # dismisses, UpdaterDelegate's shouldProceedWithUpdate suppresses
        # the same version on subsequent background checks until the
        # app restarts or the user hits Check for Updates explicitly.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 300   # 5 minutes
        # Human-readable git-derived version. Default value used for ad-hoc
        # dev builds; scripts/release.sh overrides via xcodebuild GIT_DESCRIBE=…
        GitDescribe: $(GIT_DESCRIBE)
    settings:
      base:
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION are PLACEHOLDERS.
        # Real values come from scripts/release.sh which derives them from git
        # (commit count + short sha) and passes them as xcodebuild overrides.
        # Do not edit these by hand.
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX
        PRODUCT_NAME: PhotoX
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: PhotoX/PhotoX.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        # Default GitDescribe for ad-hoc dev builds; release.sh overrides.
        GIT_DESCRIBE: "0.0.0-uninitialized"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Obj-C++ bridge for LibRaw
        SWIFT_OBJC_BRIDGING_HEADER: PhotoX/PhotoX-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        # Static LibRaw (built into ThirdParty/libraw by scripts/bootstrap.sh)
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/ThirdParty/libraw/include
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/ThirdParty/libraw/lib/libraw_r.a
          - -lz
      configs:
        # Debug builds get a distinct bundle ID so macOS Launch Services
        # treats the dev build as a separate app from the installed
        # /Applications/PhotoX.app. Without this, clicking a notification
        # posted by the dev build routes to the installed Release copy
        # (same bundle ID → Launch Services picks the registered one).
        # Side effect: UserDefaults / Recents / Favorites / Export
        # Settings are also separate between Debug and Release — cleaner
        # for development, and you don't accidentally pollute your real
        # data while testing.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX.debug
          # Distinct iconset with an amber "DEV" pill so the debug build
          # is visually obvious in Finder, Dock, and Cmd-Tab. Generated
          # by scripts/generate_icon.swift (or `just icon`).
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
          # Debug builds are ad-hoc and need the library-validation
          # exception so the hardened runtime loads ad-hoc Sparkle.
          # Release uses PhotoX.entitlements (no exception) since we
          # Developer-ID re-sign Sparkle in scripts/release.sh.
          CODE_SIGN_ENTITLEMENTS: PhotoX/PhotoX-Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoX

  PhotoXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoXTests
    dependencies:
      - target: PhotoX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostman.PhotoXTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhotoX:
    build:
      targets:
        PhotoX: all
        PhotoXTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoXTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
